<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Web Visualizer</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header>
    <h1>Web Visualizer <small id="ver" class="muted"></small></h1>
    <span class="muted">저장 없이 메모리에서만 분석</span>
  </header>

  <section class="controls">
    <div class="row">
      <button id="btn-extract" class="primary">보이는 댓글 분석</button>
      <button id="btn-more">더 불러와 분석</button>
      <label>최대 <input id="max" type="number" value="300" min="20" step="20" /></label>
    </div>
    <div class="row">
      <label>분석 방식
        <select id="mode">
          <option value="auto">의미 + 문구 (EmbeddingGemma)</option>
          <option value="fast">문구만 (즉시)</option>
        </select>
      </label>
    </div>
    <p id="status" class="status"></p>
  </section>

  <section id="result" hidden>
    <h2 id="doc-title"></h2>
    <p id="doc-meta" class="muted"></p>
    <div class="stats" id="stats"></div>

    <div class="graph-wrap">
      <canvas id="graph"></canvas>
      <div id="tooltip" class="tooltip" hidden></div>
    </div>
    <p class="hint muted">점 = 댓글 (크기: 좋아요 · 색: 주제 묶음 · <span class="warn">주황 테두리</span>: 복붙 의심 신호) · 가운데 = 본문<br>드래그 이동 · 휠 확대 · 클릭하면 페이지의 해당 댓글로 이동</p>

    <div class="row slider">
      <label class="grow">주제 묶음 기준 (의미 유사도) ≥ <b id="th-sem-val"></b>
        <input id="th-sem" type="range" min="0.1" max="0.99" step="0.01" />
      </label>
    </div>
    <h3 id="topics-title">주제 묶음 <span class="muted">의미가 비슷한 댓글끼리</span></h3>
    <ol id="topics" class="clusters"></ol>

    <div class="row slider">
      <label class="grow">복붙 판단 기준 (문구 유사도) ≥ <b id="th-lex-val"></b>
        <input id="th-lex" type="range" min="0.3" max="0.99" step="0.01" value="0.6" />
      </label>
    </div>
    <h3>복붙·템플릿 의심 신호 <span class="muted">문구가 겹치는 댓글 묶음 · 판정이 아닌 참고 지표</span></h3>
    <ol id="signals" class="clusters"></ol>

    <h3>작성 시각 분포 <span class="muted">(상대시간 기반 근사)</span></h3>
    <div id="hist"></div>

    <button id="btn-export" class="link">JSON 내보내기 (개발용 샘플)</button>
  </section>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
